const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const quickQuestions = document.getElementById('quickQuestions');

function ask(index) {
  const item = faq[index];
  addUserMessage(item.q);
  showTyping(() => {
    addAiMessage(item.a, item.source);
  });
}

function sendQuestion() {
  const text = userInput.value.trim();
  if (!text) return;
  
  addUserMessage(text);
  userInput.value = '';
  
  // 关键词匹配
  const matched = matchQuestion(text);
  if (matched !== -1) {
    showTyping(() => {
      addAiMessage(faq[matched].a, faq[matched].source);
    });
  } else {
    showTyping(() => {
      addAiMessage(
        `<p>抱歉，我暂时没有关于这个问题的详细回答。</p>
         <p>你可以尝试点击下方常见问题，或前往<a href="index.html" class="text-blue-600 underline">知识库</a>浏览全部22个主题、140个法规文件。</p>
         <p>如果你的问题比较复杂，建议咨询专业执业律师。</p>`,
        "知识库检索"
      );
    });
  }
}

function matchQuestion(text) {
  const keywords = [
    ['购物', '强迫', '旅游', '投诉', '旅行社', '导游'],
    ['工作签证', '工作许可', 'Z字', '来华工作', '就业许可'],
    ['五星卡', '永久居留', '绿卡', '永居', '永久居住'],
    ['创业', '开公司', 'WFOE', '外商投资', '企业设立', '注册公司'],
    ['交通事故', '车祸', '撞车', '交警', '122'],
    ['欠薪', '拖欠工资', '劳动仲裁', '12333', '不发工资'],
    ['入境', '签证', '免签', '护照', '来中国', 'L字', 'M字'],
    ['结婚', '婚姻', '涉外婚姻', '登记', '单身证明'],
    ['社保', '社会保险', '养老保险', '医疗保险', '五险一金'],
    ['租房', '住房', '房东', '住宿登记', '租赁合同']
  ];
  
  text = text.toLowerCase();
  let bestMatch = -1;
  let bestScore = 0;
  
  for (let i = 0; i < keywords.length; i++) {
    let score = 0;
    for (let kw of keywords[i]) {
      if (text.includes(kw)) score++;
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = i;
    }
  }
  return bestMatch;
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'flex gap-3 justify-end fade-in';
  div.innerHTML = `
    <div class="bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm max-w-[85%] text-sm leading-relaxed">${escapeHtml(text)}</div>
    <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0">你</div>
  `;
  chatBox.appendChild(div);
  scrollToBottom();
}

function showTyping(callback) {
  const div = document.createElement('div');
  div.className = 'flex gap-3 fade-in';
  div.id = 'typing';
  div.innerHTML = `
    <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-blue-400 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0">W</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
      <div class="flex gap-1">
        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
      </div>
    </div>
  `;
  chatBox.appendChild(div);
  scrollToBottom();
  
  setTimeout(() => {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
    callback();
  }, 1500 + Math.random() * 1000);
}

function addAiMessage(html, source) {
  const div = document.createElement('div');
  div.className = 'flex gap-3 fade-in';
  div.innerHTML = `
    <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-blue-400 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0">W</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm max-w-[85%] text-sm leading-relaxed text-gray-700">
      ${html}
      <div class="source-tag">📚 来源：${escapeHtml(source)}</div>
    </div>
  `;
  chatBox.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
